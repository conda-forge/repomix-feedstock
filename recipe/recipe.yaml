# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.19.0"

package:
  name: repomix
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/repomix/-/repomix-${{ version }}.tgz
  sha256: e5504ac6a3e1729b27b78efa8e7f15c468bda64c5aad533566666e3d95ccc064

build:
  number: 0
  noarch: generic

requirements:
  build:
    - nodejs
    - pnpm
    - pnpm-licenses
  host:
    - nodejs
  run:
    - nodejs >=22

tests:
  - script:
      - repomix --help
      - repomix --version

about:
  license: MIT
  license_file:
    - LICENSE
    - third-party-licenses.txt
  summary: Pack repository contents into a single file for AI consumption
  description: |
    Repomix packs an entire repository into a single, AI-friendly file.
    Ideal for feeding codebases to LLMs such as Claude, ChatGPT, and Gemini.
  homepage: https://github.com/yamadashy/repomix
  repository: https://github.com/yamadashy/repomix

extra:
  recipe-maintainers:
    - anjos
